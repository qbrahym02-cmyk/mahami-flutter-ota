name: Build & Publish Update

# كل دفعة (push) لتعديل في كود التطبيق على main:
#   1) تبني APK موقّع برقم بناء جديد تلقائياً
#   2) تنشره في GitHub Releases
#   3) تحدّث remote/version.json  ← التطبيقات المثبّتة تكتشف التحديث وتعرضه
#   4) تنشر نسخة الويب على GitHub Pages (تتحدث فوراً بدون أي تثبيت)
#
# ملاحظة: تعديل remote/config.json وحده لا يشغّل هذا — يصل للمستخدمين فوراً.

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      changelog:
        description: "ما الجديد في هذا التحديث؟"
        required: false
        default: ""
      mandatory:
        description: "تحديث إجباري؟"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version info
        id: meta
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          BUILD=$((100 + ${{ github.run_number }}))
          echo "name=$NAME"   >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME-b$BUILD" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Updates must be signed with the same key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=${{ steps.meta.outputs.name }} \
            --build-number=${{ steps.meta.outputs.build }}
          cp build/app/outputs/flutter-apk/app-release.apk mahami.apk
          sha256sum mahami.apk | cut -d' ' -f1 > mahami.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          NOTES="$INPUT_CHANGELOG"
          if [ -z "$NOTES" ]; then NOTES="$(git log -1 --pretty=%s)"; fi
          echo "$NOTES" > notes.txt
          gh release create "${{ steps.meta.outputs.tag }}" mahami.apk \
            --title "مهامي ${{ steps.meta.outputs.name }} (بناء ${{ steps.meta.outputs.build }})" \
            --notes-file notes.txt

      - name: Update remote/version.json
        env:
          INPUT_MANDATORY: ${{ github.event.inputs.mandatory }}
        run: |
          python3 - <<'PY'
          import json, os
          json.dump({
              "version_name": "${{ steps.meta.outputs.name }}",
              "build_number": int("${{ steps.meta.outputs.build }}"),
              "apk_url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/mahami.apk",
              "sha256": open("mahami.apk.sha256").read().strip(),
              "changelog": open("notes.txt", encoding="utf-8").read().strip(),
              "mandatory": os.environ.get("INPUT_MANDATORY") == "true",
          }, open("remote/version.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          cat remote/version.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote/version.json
          git commit -m "chore: publish ${{ steps.meta.outputs.tag }} [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
